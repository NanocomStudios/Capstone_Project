    build: Legacy/wms/.
    ports:
      - "9000:8000"

  wms_adapter:
    build: Services/wms_adapter/.
    ports:
      - "8001:8000"
    environment:
      LEGACY_WMS_HOST: host.docker.internal
      LEGACY_WMS_PORT: "9000"
    depends_on:
      wms_legacy:
        condition: service_started

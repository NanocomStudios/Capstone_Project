name: swiftlogistics

services:

  service-registry:
    build: Services/service_registry/.
    ports:
      - "8001:8000"

  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    healthcheck:
      test: rabbitmq-diagnostics check_port_connectivity
      interval: 1s
      timeout: 3s
      retries: 30

  wms-legacy:
    build: Legacy/wms/.
    ports:
      - "9000:8000"

  wms-adapter:
    build: Services/wms_adapter/.
    ports:
      - "8002:8000"
    environment:
      LEGACY_WMS_HOST: wms-legacy
      LEGACY_WMS_PORT: "8000"
      SERVICE_REG_HOST: service-registry
      SERVICE_REG_PORT: "8000"
      SERVICE_HOST: wms-adapter
      SERVICE_PORT: "8002"
      RABBITMQ_HOST: rabbitmq
    depends_on:
      wms-legacy:
        condition: service_started
      rabbitmq:
        condition: service_healthy
      service-registry:
        condition: service_healthy
        
  cms-legacy:
    build: Legacy/cms/.
    ports:
      - "9001:8000"

  cms-adapter:
    build: Services/cms_adapter/.
    ports:
      - "8003:8000"
    environment:
      SERVICE_REG_HOST: service-registry
      LEGACY_CMS_HOST: cms-legacy
      SERVICE_HOST: cms-adapter
      SERVICE_PORT: "8003"
    depends_on:
      service-registry:
        condition: service_healthy
      cms-legacy:
        condition: service_started

  order-service:
    build: Services/order_service/.
    ports:
      - "8004:8000"
    environment:
      RABBIT_HOST: rabbitmq
      CMS_ADAPTER_URL: http://cms-adapter:8000
      ROS_ADAPTER_URL: http://ros-adapter:8000
      WMS_ADAPTER_URL: http://wms-adapter:8000
      SERVICE_REG_HOST: service-registry
      AUTH_SERVICE_URL: http://auth-service:8000
      DELIVERY_SERVICE_HOST: http://delivery-service:8000
    depends_on:
      rabbitmq:
        condition: service_healthy
      service-registry:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: deliverydb
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  ros-legacy:
    build: Legacy/ros/.
    ports:
      - "9002:8000"
      
  delivery-service:
    build: Services/delivery_service/.
    ports:
      - "8005:8000"
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/deliverydb
      ROS_SERVICE_URL: http://ros-legacy:8000
      SERVICE_REG_HOST: service-registry
      SERVICE_HOST: delivery-service
      SERVICE_PORT: "8005"
      RABBITMQ_HOST: rabbitmq
    depends_on:
      db:
        condition: service_healthy
      ros-legacy:
        condition: service_started
      service-registry:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  auth-service:
    build: Services/auth_service/.
    ports:
      - "8006:8000"
    environment:
      SERVICE_REG_HOST: service-registry
      SERVICE_HOST: auth-service
      SERVICE_PORT: "8006"
    depends_on:
      service-registry:
        condition: service_healthy

  client-app:
    build: Client/.
    ports:
      - "8000:80"

    depends_on:
      # service-registry:
      #   condition: service_healthy
      # wms-adapter:
      #   condition: service_healthy
      # cms-adapter:
      #   condition: service_healthy
      # order-service:
      #   condition: service_healthy
      # delivery-service:
      #   condition: service_healthy
      auth-service:
        condition: service_healthy

volumes:
  postgres_data:

name: swiftlogistics

services:

  service_registry:
    build: Services/service_registry/.
    ports:
      - "8001:8000"

  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    healthcheck:
      test: rabbitmq-diagnostics check_port_connectivity
      interval: 1s
      timeout: 3s
      retries: 30

  wms_legacy:
    build: Legacy/wms/.
    ports:
      - "9000:8000"

  wms_adapter:
    build: Services/wms_adapter/.
    ports:
      - "8002:8000"
    environment:
      LEGACY_WMS_HOST: host.docker.internal
      LEGACY_WMS_PORT: "9000"
      SERVICE_REG_HOST: host.docker.internal
      SERVICE_REG_PORT: "8001"
      SERVICE_HOST: host.docker.internal
      SERVICE_PORT: "8003"
    depends_on:
      wms_legacy:
        condition: service_started
      rabbitmq:
        condition: service_healthy
      service_registry:
        condition: service_healthy
        
  cms_legacy:
    build: Legacy/cms/.
    ports:
      - "9001:8000"

  cms_adapter:
    build: Services/cms_adapter/.
    ports:
      - "8003:8000"
    environment:
      SERVICE_REG_HOST: host.docker.internal
      SERVICE_REG_PORT: "8001"
      SERVICE_HOST: host.docker.internal
      SERVICE_PORT: "8003"
    depends_on:
      service_registry:
        condition: service_healthy
      cms_legacy:
        condition: service_started